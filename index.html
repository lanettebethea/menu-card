<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Callie's Cuisine Menu Card</h1>

  <form id="menu-form">
    <label for="menu-input">Paste your menu as JSON</label>
    <textarea id="menu-input" rows="8">
          {"name": "Hot Dog", "price": 7.5},
          {"name": "Hamburger", "price": 8.0},
          {"name": "Sausage", "price": 7.75},
          {"name": "Cheeseburger", "price": 8.5}
    </textarea>
    <button type="submit">Show my menu</button>
  </form>

  <p id="count"></p>
  <p id="menu-text"></p>

  <script src="script.js"></script>
</body>
</html>
